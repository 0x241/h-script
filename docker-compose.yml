x-app-build: &app-build
  context: .
  dockerfile: Dockerfile

# Non-secret policy is shared by web preflight and the recovery worker.
# Drill credentials remain mounted only in the recovery service.
x-recovery-policy: &recovery-policy
  RECOVERY_CMS_RPO_SECONDS: ${RECOVERY_CMS_RPO_SECONDS:-86400}
  RECOVERY_CMS_RTO_SECONDS: ${RECOVERY_CMS_RTO_SECONDS:-14400}
  RECOVERY_COLLECTOR_RPO_SECONDS: ${RECOVERY_COLLECTOR_RPO_SECONDS:-21600}
  RECOVERY_COLLECTOR_RTO_SECONDS: ${RECOVERY_COLLECTOR_RTO_SECONDS:-7200}
  RECOVERY_SERVICE_TOKENS_RPO_SECONDS: ${RECOVERY_SERVICE_TOKENS_RPO_SECONDS:-21600}
  RECOVERY_SERVICE_TOKENS_RTO_SECONDS: ${RECOVERY_SERVICE_TOKENS_RTO_SECONDS:-7200}
  RECOVERY_DRILL_MAX_AGE_SECONDS: ${RECOVERY_DRILL_MAX_AGE_SECONDS:-604800}

services:
  app:
    build: *app-build
    image: ${APP_IMAGE_REF:-${APP_IMAGE:-h-script}:${APP_IMAGE_TAG:-local}}
    pull_policy: ${APP_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
    environment:
      <<: *recovery-policy
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      APP_SYS_ID: ${APP_SYS_ID:?set stable APP_SYS_ID}
      APP_SYS_MAIL: ${APP_SYS_MAIL:?set APP_SYS_MAIL}
      APP_CFG_LINK: ${APP_CFG_LINK:-_cfg}
      APP_HTTP_USER_AGENT: ${APP_HTTP_USER_AGENT:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      OBSERVABILITY_LOG_PATH: ${OBSERVABILITY_LOG_PATH:-/var/www/shared/logs/observability.ndjson}
      OBSERVABILITY_METRICS_PATH: ${OBSERVABILITY_METRICS_PATH:-/var/www/shared/logs/metrics.ndjson}
      OBSERVABILITY_LOG_MAX_BYTES: ${OBSERVABILITY_LOG_MAX_BYTES:-20971520}
      OBSERVABILITY_METRICS_MAX_BYTES: ${OBSERVABILITY_METRICS_MAX_BYTES:-20971520}
      OBSERVABILITY_CRON_MAX_AGE_SECONDS: ${OBSERVABILITY_CRON_MAX_AGE_SECONDS:-180}
      OBSERVABILITY_QUEUE_MAX_DEPTH: ${OBSERVABILITY_QUEUE_MAX_DEPTH:-1000}
      OBSERVABILITY_QUEUE_MAX_AGE_SECONDS: ${OBSERVABILITY_QUEUE_MAX_AGE_SECONDS:-900}
      OBSERVABILITY_QUEUE_MAX_FAILED: ${OBSERVABILITY_QUEUE_MAX_FAILED:-100}
      OBSERVABILITY_DNS_BACKLOG_MAX: ${OBSERVABILITY_DNS_BACKLOG_MAX:-1000}
      OBSERVABILITY_DB_SLOW_MS: ${OBSERVABILITY_DB_SLOW_MS:-3000}
      OBSERVABILITY_ALERT_WINDOW_SECONDS: ${OBSERVABILITY_ALERT_WINDOW_SECONDS:-300}
      OBSERVABILITY_HTTP_ERROR_THRESHOLD: ${OBSERVABILITY_HTTP_ERROR_THRESHOLD:-5}
      OBSERVABILITY_SESSION_FAILURE_THRESHOLD: ${OBSERVABILITY_SESSION_FAILURE_THRESHOLD:-1}
      OBSERVABILITY_TELEMETRY_FAILURE_THRESHOLD: ${OBSERVABILITY_TELEMETRY_FAILURE_THRESHOLD:-5}
      OBSERVABILITY_GATEWAY_FAILURE_THRESHOLD: ${OBSERVABILITY_GATEWAY_FAILURE_THRESHOLD:-3}
      OBSERVABILITY_ALERT_COMMAND: ${OBSERVABILITY_ALERT_COMMAND:-}
      APP_GENERATE_CONFIG: ${APP_GENERATE_CONFIG:-1}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-0}
      APP_DATA_KEY: ${APP_DATA_KEY:-}
      APP_DATA_KEY_FILE: ${APP_DATA_KEY_FILE:-}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-https://h-script.com/api/v1/installations}
      TELEMETRY_COLLECTOR_ENABLED: ${TELEMETRY_COLLECTOR_ENABLED:-0}
      TELEMETRY_INGESTION_ENABLED: ${TELEMETRY_INGESTION_ENABLED:-0}
      TELEMETRY_COLLECTOR_DOMAIN: ${TELEMETRY_COLLECTOR_DOMAIN:-h-script.com}
      TELEMETRY_RATE_LIMIT: ${TELEMETRY_RATE_LIMIT:-30}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-2147483648}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-134217728}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MYSQLDUMP_PATH: ${BACKUP_MYSQLDUMP_PATH:-}
      BACKUP_MYSQL_PATH: ${BACKUP_MYSQL_PATH:-}
      RESTORE_MAX_STATEMENT_BYTES: ${RESTORE_MAX_STATEMENT_BYTES:-16777216}
      UPDATE_WORK_PATH: ${UPDATE_WORK_PATH:-}
      UPDATE_BACKUP_MAX_AGE_SECONDS: ${UPDATE_BACKUP_MAX_AGE_SECONDS:-3600}
      UPDATE_TELEMETRY_MAX_AGE_SECONDS: ${UPDATE_TELEMETRY_MAX_AGE_SECONDS:-172800}
      UPDATE_MAX_PACKAGE_BYTES: ${UPDATE_MAX_PACKAGE_BYTES:-268435456}
      UPDATE_MAX_UNPACKED_BYTES: ${UPDATE_MAX_UNPACKED_BYTES:-536870912}
      UPDATE_MAX_FILES: ${UPDATE_MAX_FILES:-10000}
      UPDATE_MIN_FREE_BYTES: ${UPDATE_MIN_FREE_BYTES:-134217728}
      UPDATE_RETENTION_COUNT: ${UPDATE_RETENTION_COUNT:-3}
      CONFIGURATOR_ALLOWED_CIDRS: ${CONFIGURATOR_ALLOWED_CIDRS:-}
      INTEGRITY_SCAN_BATCH_FILES: ${INTEGRITY_SCAN_BATCH_FILES:-1000}
      INTEGRITY_SCAN_MAX_SECONDS: ${INTEGRITY_SCAN_MAX_SECONDS:-10}
      INTEGRITY_SCAN_MAX_FILES: ${INTEGRITY_SCAN_MAX_FILES:-20000}
      INTEGRITY_SCAN_MAX_FINDINGS: ${INTEGRITY_SCAN_MAX_FINDINGS:-500}
      INTEGRITY_NOTIFY: ${INTEGRITY_NOTIFY:-0}
      CONFIGURATOR_PASSWORD: ${CONFIGURATOR_PASSWORD:-}
      CONFIGURATOR_PASSWORD_FILE: ${CONFIGURATOR_PASSWORD_FILE:-}
      ALLOW_EMPTY_CONFIGURATOR_PASSWORD: ${ALLOW_EMPTY_CONFIGURATOR_PASSWORD:-0}
      REQUIRE_TURNSTILE: ${REQUIRE_TURNSTILE:-1}
      DB_HOST: database:3306
      DB_NAME: ${DB_NAME:-hscript}
      DB_USER: ${DB_USER:-hscript}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_TYPE: ${DB_TYPE:-1}
      REDIS_ENABLED: ${REDIS_ENABLED:-1}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-hs:}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SITE_KEY_FILE: ${TURNSTILE_SITE_KEY_FILE:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SECRET_KEY_FILE: ${TURNSTILE_SECRET_KEY_FILE:-}
      APP_AUTO_INSTALL: ${APP_AUTO_INSTALL:-0}
      INSTALL_ADMIN_NAME: ${INSTALL_ADMIN_NAME:-Administrator}
      INSTALL_ADMIN_LOGIN: ${INSTALL_ADMIN_LOGIN:-admin}
      INSTALL_ADMIN_PASSWORD: ${INSTALL_ADMIN_PASSWORD:-}
      INSTALL_ADMIN_PASSWORD_FILE: ${INSTALL_ADMIN_PASSWORD_FILE:-}
      INSTALL_ADMIN_MAIL: ${INSTALL_ADMIN_MAIL:-}
      INSTALL_ADMIN_SECRET_QUESTION: ${INSTALL_ADMIN_SECRET_QUESTION:-That is your name}
      INSTALL_ADMIN_SECRET_ANSWER: ${INSTALL_ADMIN_SECRET_ANSWER:-}
      INSTALL_ADMIN_SECRET_ANSWER_FILE: ${INSTALL_ADMIN_SECRET_ANSWER_FILE:-}
      INSTALL_ADMIN_PIN: ${INSTALL_ADMIN_PIN:-}
      INSTALL_ADMIN_PIN_FILE: ${INSTALL_ADMIN_PIN_FILE:-}
      INSTALL_MAIL_HOST: ${INSTALL_MAIL_HOST:-}
      INSTALL_MAIL_PORT: ${INSTALL_MAIL_PORT:-587}
      INSTALL_MAIL_SECURE: ${INSTALL_MAIL_SECURE:-1}
      INSTALL_MAIL_USERNAME: ${INSTALL_MAIL_USERNAME:-}
      INSTALL_MAIL_PASSWORD: ${INSTALL_MAIL_PASSWORD:-}
      INSTALL_MAIL_PASSWORD_FILE: ${INSTALL_MAIL_PASSWORD_FILE:-}
      INSTALL_MAIL_PASSWORD_B64: ${INSTALL_MAIL_PASSWORD_B64:-}
      INSTALL_MAIL_FROM_ADDRESS: ${INSTALL_MAIL_FROM_ADDRESS:-}
      INSTALL_MAIL_ADMIN_ADDRESS: ${INSTALL_MAIL_ADMIN_ADDRESS:-}
      INSTALL_MAIL_ADMIN_LANG: ${INSTALL_MAIL_ADMIN_LANG:-en}
      INSTALL_DEMO_ADMIN_NAME: ${INSTALL_DEMO_ADMIN_NAME:-Demo Administrator}
      INSTALL_DEMO_ADMIN_LOGIN: ${INSTALL_DEMO_ADMIN_LOGIN:-demo-admin}
      INSTALL_DEMO_ADMIN_PASSWORD: ${INSTALL_DEMO_ADMIN_PASSWORD:-}
      INSTALL_DEMO_ADMIN_PASSWORD_FILE: ${INSTALL_DEMO_ADMIN_PASSWORD_FILE:-}
      INSTALL_DEMO_ADMIN_MAIL: ${INSTALL_DEMO_ADMIN_MAIL:-}
      INSTALL_DEMO_ADMIN_SECRET_QUESTION: ${INSTALL_DEMO_ADMIN_SECRET_QUESTION:-That is your demo name}
      INSTALL_DEMO_ADMIN_SECRET_ANSWER: ${INSTALL_DEMO_ADMIN_SECRET_ANSWER:-}
      INSTALL_DEMO_ADMIN_SECRET_ANSWER_FILE: ${INSTALL_DEMO_ADMIN_SECRET_ANSWER_FILE:-}
      INSTALL_DEMO_ADMIN_PIN: ${INSTALL_DEMO_ADMIN_PIN:-}
      INSTALL_DEMO_ADMIN_PIN_FILE: ${INSTALL_DEMO_ADMIN_PIN_FILE:-}
      INSTALL_NO_LOGINS: ${INSTALL_NO_LOGINS:-0}
      INSTALL_INT_CURR: ${INSTALL_INT_CURR:-0}
      INSTALL_INT_CURR_ID: ${INSTALL_INT_CURR_ID:-USD}
      INSTALL_TELEMETRY_STATS: ${INSTALL_TELEMETRY_STATS:-1}
    volumes:
      - hscript_upload:/var/www/shared/upload
      - hscript_logs:/var/www/shared/logs
      - hscript_tpl_c:/var/www/shared/tpl_c
      - hscript_compile:/var/www/shared/compile
      - hscript_backup:/var/www/shared/backup
      - hscript_cfg:/var/www/shared/.cfg
      - hscript_config:/var/www/shared/config
      - hscript_themes:/var/www/shared/themes
    networks:
      internal:
      proxy:
        aliases:
          - ${APP_NETWORK_ALIAS:-hscript-app}
    healthcheck:
      test: ["CMD-SHELL", "php bin/observability.php process >/dev/null && curl -fsS -H \"Host: $${APP_DOMAIN}\" \"http://127.0.0.1/$${APP_CFG_LINK:-_cfg}?update\" -o /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  cron:
    build: *app-build
    image: ${APP_IMAGE_REF:-${APP_IMAGE:-h-script}:${APP_IMAGE_TAG:-local}}
    pull_policy: ${APP_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["hscript-cron"]
    environment:
      START_PHP_FPM: 0
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-0}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      APP_SYS_ID: ${APP_SYS_ID:?set stable APP_SYS_ID}
      APP_SYS_MAIL: ${APP_SYS_MAIL:?set APP_SYS_MAIL}
      APP_CFG_LINK: ${APP_CFG_LINK:-_cfg}
      APP_HTTP_USER_AGENT: ${APP_HTTP_USER_AGENT:-}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}
      OBSERVABILITY_LOG_PATH: ${OBSERVABILITY_LOG_PATH:-/var/www/shared/logs/observability.ndjson}
      OBSERVABILITY_METRICS_PATH: ${OBSERVABILITY_METRICS_PATH:-/var/www/shared/logs/metrics.ndjson}
      OBSERVABILITY_LOG_MAX_BYTES: ${OBSERVABILITY_LOG_MAX_BYTES:-20971520}
      OBSERVABILITY_METRICS_MAX_BYTES: ${OBSERVABILITY_METRICS_MAX_BYTES:-20971520}
      APP_GENERATE_CONFIG: ${APP_GENERATE_CONFIG:-1}
      APP_DEMO_MODE: ${APP_DEMO_MODE:-0}
      APP_DATA_KEY: ${APP_DATA_KEY:-}
      APP_DATA_KEY_FILE: ${APP_DATA_KEY_FILE:-}
      TELEMETRY_ENDPOINT: ${TELEMETRY_ENDPOINT:-https://h-script.com/api/v1/installations}
      BACKUP_STORAGE_PATH: ${BACKUP_STORAGE_PATH:-}
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-2147483648}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-134217728}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MYSQLDUMP_PATH: ${BACKUP_MYSQLDUMP_PATH:-}
      BACKUP_MYSQL_PATH: ${BACKUP_MYSQL_PATH:-}
      UPDATE_WORK_PATH: ${UPDATE_WORK_PATH:-}
      UPDATE_BACKUP_MAX_AGE_SECONDS: ${UPDATE_BACKUP_MAX_AGE_SECONDS:-3600}
      CONFIGURATOR_ALLOWED_CIDRS: ${CONFIGURATOR_ALLOWED_CIDRS:-}
      UPDATE_TELEMETRY_MAX_AGE_SECONDS: ${UPDATE_TELEMETRY_MAX_AGE_SECONDS:-172800}
      INTEGRITY_SCAN_BATCH_FILES: ${INTEGRITY_SCAN_BATCH_FILES:-1000}
      INTEGRITY_SCAN_MAX_SECONDS: ${INTEGRITY_SCAN_MAX_SECONDS:-10}
      INTEGRITY_SCAN_MAX_FILES: ${INTEGRITY_SCAN_MAX_FILES:-20000}
      INTEGRITY_SCAN_MAX_FINDINGS: ${INTEGRITY_SCAN_MAX_FINDINGS:-500}
      INTEGRITY_NOTIFY: ${INTEGRITY_NOTIFY:-0}
      CONFIGURATOR_PASSWORD: ${CONFIGURATOR_PASSWORD:-}
      CONFIGURATOR_PASSWORD_FILE: ${CONFIGURATOR_PASSWORD_FILE:-}
      ALLOW_EMPTY_CONFIGURATOR_PASSWORD: ${ALLOW_EMPTY_CONFIGURATOR_PASSWORD:-0}
      REQUIRE_TURNSTILE: ${REQUIRE_TURNSTILE:-1}
      DB_HOST: database:3306
      DB_NAME: ${DB_NAME:-hscript}
      DB_USER: ${DB_USER:-hscript}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_TYPE: ${DB_TYPE:-1}
      REDIS_ENABLED: ${REDIS_ENABLED:-1}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-hs:}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SITE_KEY_FILE: ${TURNSTILE_SITE_KEY_FILE:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SECRET_KEY_FILE: ${TURNSTILE_SECRET_KEY_FILE:-}
      APP_AUTO_INSTALL: 0
      CRON_ENABLED: ${CRON_ENABLED:-1}
      CRON_URL: ${CRON_URL:-http://app/cron}
      CRON_HOST_HEADER: ${CRON_HOST_HEADER:-}
      CRON_INTERVAL_SECONDS: ${CRON_INTERVAL_SECONDS:-60}
      CRON_TIMEOUT_SECONDS: ${CRON_TIMEOUT_SECONDS:-30}
      CRON_START_DELAY_SECONDS: ${CRON_START_DELAY_SECONDS:-10}
    volumes:
      - hscript_upload:/var/www/shared/upload
      - hscript_logs:/var/www/shared/logs
      - hscript_tpl_c:/var/www/shared/tpl_c
      - hscript_compile:/var/www/shared/compile
      - hscript_backup:/var/www/shared/backup
      - hscript_cfg:/var/www/shared/.cfg
      - hscript_config:/var/www/shared/config
      - hscript_themes:/var/www/shared/themes
    networks:
      - internal

  recovery:
    build: *app-build
    image: ${APP_IMAGE_REF:-${APP_IMAGE:-h-script}:${APP_IMAGE_TAG:-local}}
    pull_policy: ${APP_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      database:
        condition: service_healthy
    command: ["hscript-recovery-scheduler"]
    environment:
      <<: *recovery-policy
      START_PHP_FPM: 0
      APP_ENV: ${APP_ENV:-production}
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      APP_GENERATE_CONFIG: 0
      APP_AUTO_INSTALL: 0
      REQUIRE_TURNSTILE: ${REQUIRE_TURNSTILE:-1}
      UPDATE_WORK_PATH: ${UPDATE_WORK_PATH:-}
      UPDATE_BACKUP_MAX_AGE_SECONDS: ${UPDATE_BACKUP_MAX_AGE_SECONDS:-3600}
      REDIS_ENABLED: ${REDIS_ENABLED:-1}
      UPDATE_TELEMETRY_MAX_AGE_SECONDS: ${UPDATE_TELEMETRY_MAX_AGE_SECONDS:-172800}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_PREFIX: ${REDIS_PREFIX:-hs:}
      REDIS_CONNECT_TIMEOUT: ${REDIS_CONNECT_TIMEOUT:-1}
      APP_DATA_KEY: ${APP_DATA_KEY:-}
      APP_DATA_KEY_FILE: ${APP_DATA_KEY_FILE:-}
      DB_HOST: database:3306
      DB_NAME: ${DB_NAME:-hscript}
      DB_USER: ${DB_USER:-hscript}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      DB_TYPE: ${DB_TYPE:-1}
      OBSERVABILITY_LOG_PATH: ${OBSERVABILITY_LOG_PATH:-/var/www/shared/logs/observability.ndjson}
      OBSERVABILITY_METRICS_PATH: ${OBSERVABILITY_METRICS_PATH:-/var/www/shared/logs/metrics.ndjson}
      OBSERVABILITY_LOG_MAX_BYTES: ${OBSERVABILITY_LOG_MAX_BYTES:-20971520}
      OBSERVABILITY_METRICS_MAX_BYTES: ${OBSERVABILITY_METRICS_MAX_BYTES:-20971520}
      BACKUP_STORAGE_PATH: /var/www/shared/backup
      BACKUP_MAX_BYTES: ${BACKUP_MAX_BYTES:-2147483648}
      BACKUP_MIN_FREE_BYTES: ${BACKUP_MIN_FREE_BYTES:-134217728}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-10}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MYSQLDUMP_PATH: ${BACKUP_MYSQLDUMP_PATH:-}
      BACKUP_MYSQL_PATH: ${BACKUP_MYSQL_PATH:-}
      RESTORE_MAX_STATEMENT_BYTES: ${RESTORE_MAX_STATEMENT_BYTES:-16777216}
      RECOVERY_ENABLED: ${RECOVERY_ENABLED:-0}
      RECOVERY_RUN_ONCE: ${RECOVERY_RUN_ONCE:-0}
      RECOVERY_BACKUP_INTERVAL_SECONDS: ${RECOVERY_BACKUP_INTERVAL_SECONDS:-3600}
      RECOVERY_STATE_PATH: /var/www/shared/backup/recovery
      RECOVERY_RUNTIME_ROOT: /var/www/shared
      RECOVERY_RUNTIME_PATHS: ${RECOVERY_RUNTIME_PATHS:-upload,themes}
      RECOVERY_INCLUDE_PROTECTED_CONFIG: ${RECOVERY_INCLUDE_PROTECTED_CONFIG:-0}
      RECOVERY_RUNTIME_MAX_FILES: ${RECOVERY_RUNTIME_MAX_FILES:-100000}
      RECOVERY_RUNTIME_MAX_BYTES: ${RECOVERY_RUNTIME_MAX_BYTES:-10737418240}
      RECOVERY_ROW_BOUNDS_FILE: ${RECOVERY_ROW_BOUNDS_FILE:-/run/secrets/hscript-recovery/row-bounds.json}
      RECOVERY_DRILL_DB_HOST: ${RECOVERY_DRILL_DB_HOST:-database:3306}
      RECOVERY_DRILL_DB_ADMIN_USER: ${RECOVERY_DRILL_DB_ADMIN_USER:-root}
      RECOVERY_DRILL_DB_ADMIN_PASSWORD: ${RECOVERY_DRILL_DB_ADMIN_PASSWORD:-}
      RECOVERY_DRILL_DB_ADMIN_PASSWORD_FILE: ${RECOVERY_DRILL_DB_ADMIN_PASSWORD_FILE:-}
      RECOVERY_DRILL_DB_PREFIX: ${RECOVERY_DRILL_DB_PREFIX:-hscript_drill}
      RECOVERY_ALERT_COMMAND: ${RECOVERY_ALERT_COMMAND:-}
    volumes:
      - hscript_upload:/var/www/shared/upload:ro
      - hscript_logs:/var/www/shared/logs
      - hscript_tpl_c:/var/www/shared/tpl_c
      - hscript_compile:/var/www/shared/compile
      - hscript_backup:/var/www/shared/backup
      - hscript_cfg:/var/www/shared/.cfg
      - hscript_config:/var/www/shared/config:ro
      - hscript_themes:/var/www/shared/themes:ro
      - ${RECOVERY_SECRETS_PATH:-./docker/recovery/secrets}:/run/secrets/hscript-recovery:ro
    networks:
      - internal

  database:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:-hscript}
      MYSQL_USER: ${DB_USER:-hscript}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-}
      MYSQL_ROOT_PASSWORD_FILE: ${MYSQL_ROOT_PASSWORD_FILE:-}
    volumes:
      - hscript_db:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$${MYSQL_ROOT_PASSWORD_FILE:-}\" ]; then export MYSQL_PWD=\"$$(cat \"$${MYSQL_ROOT_PASSWORD_FILE}\")\"; else export MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\"; fi; mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  hscript_backup:
  hscript_cfg:
  hscript_compile:
  hscript_config:
  hscript_db:
  hscript_logs:
  hscript_themes:
  redis_data:
  hscript_tpl_c:
  hscript_upload:

networks:
  internal:
  proxy:
    external: true
    name: ${APP_EXTERNAL_NETWORK:?set APP_EXTERNAL_NETWORK}
