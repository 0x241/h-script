stages:
  - validate
  - build
  - scan
  - package
  - deploy
  - verify-staging
  - release
  - publish

workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: '$CI_DEBUG_TRACE == "true" || $CI_DEBUG_SERVICES == "true"'
      when: never
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
    - if: '$CI_COMMIT_BRANCH == "release/public"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

default:
  tags:
    - hscript-staging

variables:
  COMPOSE_PROJECT_NAME: hscript_staging
  # Override with the server's Tailscale IPv4 in an environment-scoped GitLab
  # variable. Loopback is the safe fallback and does not expose the app port.
  APP_BIND_IP: "127.0.0.1"
  RELEASE_PLATFORMS: linux/amd64,linux/arm64
  PUBLIC_IMAGE_NAME: h-script
  DOCKERHUB_NAMESPACE: "0x241"
  GHCR_NAMESPACE: "0x241"
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
  # One-time compare-and-swap guard for replacing the unrelated legacy GitHub
  # history. It becomes inert after the first successful public sync.
  GITHUB_LEGACY_MAIN_SHA: "15669648e78656653bf57759306b3a456cac55f5"

.shared-archive:
  script:
    - &build_shared_archive |
      : "${PACKAGE_VERSION:?PACKAGE_VERSION is required}"
      case "${PACKAGE_VERSION}" in
        *[!0-9A-Za-z._-]*|'') echo "Invalid package version" >&2; exit 1 ;;
      esac

      SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
      BUILD_DATE="$(git show -s --format=%cI HEAD)"
      mkdir -p dist
      docker buildx build \
        --target shared-release \
        --build-arg "APP_VERSION=${PACKAGE_VERSION}" \
        --build-arg "VCS_REF=${CI_COMMIT_SHA}" \
        --build-arg "BUILD_DATE=${BUILD_DATE}" \
        --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
        --output type=local,dest=dist \
        .

      ARCHIVE="dist/h-script-${PACKAGE_VERSION}-shared-hosting.tar.gz"
      test -s "${ARCHIVE}"
      test -s dist/SHA256SUMS
      ARCHIVE_CONTENTS="dist/.archive-contents-${CI_JOB_ID}.txt"
      tar -tzf "${ARCHIVE}" > "${ARCHIVE_CONTENTS}"
      for required in \
        h-script/README.md \
        h-script/LICENSE \
        h-script/RELEASE \
        h-script/SCHEMA_VERSION \
        h-script/resources/release-baseline.json \
        h-script/resources/update-compatibility.json \
        h-script/vendor/autoload.php \
        h-script/static/css/app.css \
        h-script/logs/.htaccess \
        h-script/backup/.htaccess \
        h-script/tpl_c/.htaccess \
        h-script/upload/.htaccess
      do
        grep -Fxq "${required}" "${ARCHIVE_CONTENTS}"
      done
      if grep -Eq '^h-script/(\.agents|\.codex|\.git|ci|docs|tests|node_modules|docker|dist)(/|$)|^h-script/(\.env($|\.)|_config\.php|future_works?\.md|AGENTS\.md)$|^h-script/static/css/input\.css$' "${ARCHIVE_CONTENTS}"; then
        echo "Forbidden development or secret-bearing file found in ${ARCHIVE}" >&2
        exit 1
      fi
      rm -f -- "${ARCHIVE_CONTENTS}"
      (cd dist && sha256sum -c SHA256SUMS)

validate:composer-audit:
  stage: validate
  script:
    - sh ci/supply-chain/audit.sh composer
  artifacts:
    when: always
    paths: [dist/evidence/composer.report.json, dist/evidence/composer-version.txt]
    expire_in: 30 days

validate:npm-audit:
  stage: validate
  script:
    - sh ci/supply-chain/audit.sh npm
  artifacts:
    when: always
    paths: [dist/evidence/npm-production.report.json, dist/evidence/npm-toolchain.report.json, dist/evidence/node-npm-version.txt]
    expire_in: 30 days

validate:supply-chain:
  stage: validate
  script:
    - |
      docker run --rm --network none --entrypoint php -v "${CI_PROJECT_DIR}:/src:ro" \
        composer:2@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040 /src/tests/supply_chain.php
    - sh tests/supply_chain_promotion.sh
    - sh tests/supply_chain_recovery.sh
    - sh tests/staging_image.sh

validate:secret-boundary:
  stage: validate
  resource_group: staging-image-build
  script:
    - sh ci/supply-chain/leak-test.sh
  artifacts:
    paths: [dist/evidence/secret-boundary.txt]
    expire_in: 30 days

scan:source:
  stage: scan
  script:
    - sh ci/supply-chain/scan-files.sh source
  artifacts:
    when: always
    paths: [dist/evidence/source.report.json, dist/evidence/source.cdx.json]
    expire_in: 30 days

validate:compose:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
    - if: '$CI_COMMIT_BRANCH == "release/public"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - docker compose --env-file docker/env.example config --quiet
    - sh tests/recovery_compose.sh

validate:frontend:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
    - if: '$CI_COMMIT_BRANCH == "release/public"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - docker build --target frontend-build --tag "h-script-frontend:${CI_COMMIT_SHORT_SHA}" .

validate:version:
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
    - if: '$CI_COMMIT_BRANCH == "release/public"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - APP_VERSION="$(tr -d '\r\n' < VERSION)"
    - SCHEMA_VERSION="$(tr -d '\r\n' < SCHEMA_VERSION)"
    - test -n "${APP_VERSION}"
    - test -n "${SCHEMA_VERSION}"
    - echo "${APP_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
    - echo "${SCHEMA_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
    - test -z "${CI_COMMIT_TAG:-}" || test "${CI_COMMIT_TAG#v}" = "${APP_VERSION}"

build:image-candidate:
  stage: build
  interruptible: true
  resource_group: staging-image-build
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
  script:
    - umask 077
    - |
      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      RELEASE_BUILDER="hscript-release"
      export BUILDX_CONFIG="${H_SCRIPT_BUILDX_CONFIG:-/tmp/h-script-buildx}"
      cleanup_release_build() {
        if [ -n "${RELEASE_DOCKER_CONFIG:-}" ] && [ -d "${RELEASE_DOCKER_CONFIG}" ]; then
          rm -rf -- "${RELEASE_DOCKER_CONFIG}"
        fi
      }
      trap cleanup_release_build EXIT HUP INT TERM
      export DOCKER_CONFIG="${RELEASE_DOCKER_CONFIG}"
      mkdir -p "${BUILDX_CONFIG}"
      chmod 0700 "${BUILDX_CONFIG}"

      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin

      TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
      CANDIDATE_TAG="tree-${TREE_SHA}"
      CANDIDATE_REF="${CI_REGISTRY_IMAGE}:${CANDIDATE_TAG}"
      APP_VERSION="$(tr -d '\r\n' < VERSION)"

      if docker buildx inspect "${RELEASE_BUILDER}" >/dev/null 2>&1; then
        docker buildx use "${RELEASE_BUILDER}"
      else
        docker buildx create --driver docker-container --name "${RELEASE_BUILDER}" --use
      fi
      docker buildx inspect --bootstrap
      mkdir -p dist
      build_candidate_image() {
        docker buildx build \
          --platform "${RELEASE_PLATFORMS}" \
          --target app \
          --build-arg "APP_VERSION=${APP_VERSION}" \
          --build-arg "VCS_REF=${CI_COMMIT_SHA}" \
          --build-arg "BUILD_DATE=${CI_COMMIT_TIMESTAMP}" \
          --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache" \
          --provenance=mode=max \
          --sbom=true \
          --metadata-file dist/build-metadata.json \
          --tag "${CANDIDATE_REF}" \
          --tag "${CI_REGISTRY_IMAGE}:sha-${CI_COMMIT_SHORT_SHA}" \
          --push \
          .
      }

      BUILD_ATTEMPT=1
      until build_candidate_image; do
        if [ "${BUILD_ATTEMPT}" -ge 3 ]; then
          echo "Candidate image push failed after ${BUILD_ATTEMPT} attempts" >&2
          exit 1
        fi
        BUILD_ATTEMPT=$((BUILD_ATTEMPT + 1))
        echo "Registry did not accept the complete manifest; retrying push (attempt ${BUILD_ATTEMPT}/3)" >&2
        sleep 5
      done

      # Keep cache publication separate from the release manifest. A cache
      # backend outage must not invalidate an image that was already pushed.
      if ! docker buildx build \
        --platform "${RELEASE_PLATFORMS}" \
        --target app \
        --build-arg "APP_VERSION=${APP_VERSION}" \
        --build-arg "VCS_REF=${CI_COMMIT_SHA}" \
        --build-arg "BUILD_DATE=${CI_COMMIT_TIMESTAMP}" \
        --cache-from "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache" \
        --cache-to "type=registry,ref=${CI_REGISTRY_IMAGE}:buildcache,mode=max" \
        --output type=cacheonly \
        .
      then
        echo "WARNING: candidate image is valid, but registry cache export failed" >&2
      fi

      CANDIDATE_DIGEST="$(docker buildx imagetools inspect "${CANDIDATE_REF}" --format '{{.Manifest.Digest}}')"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --env SIGSTORE_ID_TOKEN \
        --env COSIGN_YES=true \
        --env DOCKER_CONFIG=/tmp/docker-config \
        --volume "${DOCKER_CONFIG}:/tmp/docker-config:ro" \
        ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
        sign \
        --yes \
        -a "com.gitlab.ci.pipeline.id=${CI_PIPELINE_ID}" \
        -a "com.gitlab.ci.commit.sha=${CI_COMMIT_SHA}" \
        -a "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        "${CANDIDATE_REF}@${CANDIDATE_DIGEST}"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --env DOCKER_CONFIG=/tmp/docker-config \
        --volume "${DOCKER_CONFIG}:/tmp/docker-config:ro" \
        ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
        verify \
        --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/heads/${CI_COMMIT_REF_NAME}" \
        --certificate-oidc-issuer "${CI_SERVER_URL}" \
        "${CANDIDATE_REF}@${CANDIDATE_DIGEST}"
      {
        printf 'TREE_SHA=%s\n' "${TREE_SHA}"
        printf 'CANDIDATE_TAG=%s\n' "${CANDIDATE_TAG}"
        printf 'CANDIDATE_REF=%s\n' "${CANDIDATE_REF}"
        printf 'CANDIDATE_DIGEST=%s\n' "${CANDIDATE_DIGEST}"
      } > dist/candidate.env
      printf '%s@%s\n' "${CANDIDATE_REF}" "${CANDIDATE_DIGEST}" | tee dist/candidate-image.txt
  artifacts:
    reports:
      dotenv: dist/candidate.env
    paths:
      - dist/build-metadata.json
      - dist/candidate-image.txt
    expire_in: 30 days

build:verify-release-candidate:
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "release/public"'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - umask 077
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        git fetch origin release/public --depth=1
        test "${CI_COMMIT_SHA}" = "$(git rev-parse FETCH_HEAD)"
      fi

      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      cleanup_release_verify() {
        if [ -n "${RELEASE_DOCKER_CONFIG:-}" ] && [ -d "${RELEASE_DOCKER_CONFIG}" ]; then
          rm -rf -- "${RELEASE_DOCKER_CONFIG}"
        fi
      }
      trap cleanup_release_verify EXIT HUP INT TERM
      export DOCKER_CONFIG="${RELEASE_DOCKER_CONFIG}"

      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
      TREE_SHA="$(git rev-parse 'HEAD^{tree}')"
      CANDIDATE_TAG="tree-${TREE_SHA}"
      CANDIDATE_REF="${CI_REGISTRY_IMAGE}:${CANDIDATE_TAG}"
      CANDIDATE_DIGEST="$(docker buildx imagetools inspect "${CANDIDATE_REF}" --format '{{.Manifest.Digest}}')"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --env DOCKER_CONFIG=/tmp/docker-config \
        --volume "${DOCKER_CONFIG}:/tmp/docker-config:ro" \
        ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
        verify \
        --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/heads/stage/docker-release" \
        --certificate-oidc-issuer "${CI_SERVER_URL}" \
        "${CANDIDATE_REF}@${CANDIDATE_DIGEST}"
      mkdir -p dist
      {
        printf 'TREE_SHA=%s\n' "${TREE_SHA}"
        printf 'CANDIDATE_TAG=%s\n' "${CANDIDATE_TAG}"
        printf 'CANDIDATE_REF=%s\n' "${CANDIDATE_REF}"
        printf 'CANDIDATE_DIGEST=%s\n' "${CANDIDATE_DIGEST}"
      } > dist/release-candidate.env
      printf '%s@%s\n' "${CANDIDATE_REF}" "${CANDIDATE_DIGEST}"
  artifacts:
    reports:
      dotenv: dist/release-candidate.env
    expire_in: 30 days

scan:image-candidate:
  stage: scan
  needs:
    - job: build:image-candidate
      artifacts: true
      optional: true
    - job: build:verify-release-candidate
      artifacts: true
      optional: true
    - job: validate:composer-audit
    - job: validate:npm-audit
    - job: validate:supply-chain
    - job: validate:secret-boundary
  script:
    - |
      set -eu
      set +x
      umask 077
      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf -- "$RELEASE_DOCKER_CONFIG"' EXIT HUP INT TERM
      export DOCKER_CONFIG="$RELEASE_DOCKER_CONFIG"
      printf '%s' "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password-stdin
      sh ci/supply-chain/scan-image.sh
  artifacts:
    when: always
    paths: [dist/evidence/]
    expire_in: 30 days

test:release-components:
  stage: scan
  needs:
    - job: build:image-candidate
      artifacts: true
      optional: true
    - job: build:verify-release-candidate
      artifacts: true
      optional: true
  script:
    - sh ci/release-components.sh
  artifacts:
    when: always
    paths: [dist/release-components.txt]
    expire_in: 30 days

test:release-migrations:
  stage: scan
  needs:
    - job: build:image-candidate
      artifacts: true
      optional: true
    - job: build:verify-release-candidate
      artifacts: true
      optional: true
  script:
    - sh ci/release-migrations.sh
  artifacts:
    when: always
    paths: [dist/release-migrations.txt]
    expire_in: 30 days

test:release-browser:
  stage: scan
  needs:
    - job: build:image-candidate
      artifacts: true
      optional: true
    - job: build:verify-release-candidate
      artifacts: true
      optional: true
  script:
    - sh ci/release-browser.sh
  artifacts:
    when: always
    paths: [dist/release-browser.txt]
    expire_in: 30 days

package:shared-candidate:
  stage: package
  needs:
    - job: test:release-components
    - job: test:release-migrations
    - job: test:release-browser
    - job: scan:source
    - job: scan:image-candidate
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
  script:
    - PACKAGE_VERSION="$(tr -d '\r\n' < VERSION)-stage.${CI_COMMIT_SHORT_SHA}"
    - *build_shared_archive
    - sh ci/supply-chain/scan-files.sh shared "dist/h-script-${PACKAGE_VERSION}-shared-hosting.tar.gz"
  artifacts:
    paths:
      - dist/evidence/
      - dist/h-script-*-shared-hosting.tar.gz
      - dist/SHA256SUMS
    expire_in: 14 days

package:shared-release:
  stage: package
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - job: test:release-components
    - job: test:release-migrations
    - job: test:release-browser
    - job: build:verify-release-candidate
      artifacts: true
    - job: scan:image-candidate
    - job: scan:source
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - PACKAGE_VERSION="${CI_COMMIT_TAG#v}"
    - *build_shared_archive
    - sh ci/supply-chain/scan-files.sh shared "dist/h-script-${PACKAGE_VERSION}-shared-hosting.tar.gz"
    - |
      ARCHIVE="dist/h-script-${CI_COMMIT_TAG#v}-shared-hosting.tar.gz"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --env SIGSTORE_ID_TOKEN \
        --env COSIGN_YES=true \
        --volume "${CI_PROJECT_DIR}/dist:/artifacts" \
        ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
        sign-blob \
        --yes \
        --bundle "/artifacts/$(basename "${ARCHIVE}").sigstore.json" \
        "/artifacts/$(basename "${ARCHIVE}")"
      docker run --rm \
        --user "$(id -u):$(id -g)" \
        --env HOME=/tmp \
        --volume "${CI_PROJECT_DIR}/dist:/artifacts:ro" \
        ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
        verify-blob \
        --bundle "/artifacts/$(basename "${ARCHIVE}").sigstore.json" \
        --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/${CI_COMMIT_TAG}" \
        --certificate-oidc-issuer "${CI_SERVER_URL}" \
        "/artifacts/$(basename "${ARCHIVE}")"
  artifacts:
    paths:
      - dist/h-script-*-shared-hosting.tar.gz
      - dist/h-script-*-shared-hosting.tar.gz.sigstore.json
      - dist/SHA256SUMS
      - dist/evidence/
    expire_in: never

release:evidence:
  stage: deploy
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - job: build:verify-release-candidate
    - job: validate:composer-audit
    - job: validate:npm-audit
    - job: scan:source
    - job: validate:secret-boundary
    - job: scan:image-candidate
    - job: package:shared-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - sh ci/supply-chain/evidence.sh build
  artifacts:
    paths:
      - dist/evidence/
      - dist/release-evidence.tar.gz
      - dist/h-script-*-shared-hosting.tar.gz
      - dist/h-script-*-shared-hosting.tar.gz.sigstore.json
      - dist/SHA256SUMS
    expire_in: never

deploy:staging:
  stage: deploy
  resource_group: staging-runtime
  needs:
    - job: build:image-candidate
      artifacts: true
    - job: scan:image-candidate
    - job: package:shared-candidate
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
  script:
    - umask 077
    - |
      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      cleanup_staging_deploy() {
        if [ -n "${RELEASE_DOCKER_CONFIG:-}" ] && [ -d "${RELEASE_DOCKER_CONFIG}" ]; then
          rm -rf -- "${RELEASE_DOCKER_CONFIG}"
        fi
      }
      trap cleanup_staging_deploy EXIT HUP INT TERM
      export DOCKER_CONFIG="${RELEASE_DOCKER_CONFIG}"
      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin

      # Shell variables have higher Compose precedence than --env-file values.
      # Override legacy project variables such as APP_IMAGE_TAG=staging so the
      # deployment always uses the exact tree candidate built by this pipeline.
      export APP_IMAGE="${CI_REGISTRY_IMAGE}"
      export APP_IMAGE_TAG="${CANDIDATE_TAG}"
      export APP_IMAGE_REF="${CANDIDATE_REF%@*}@${CANDIDATE_DIGEST}"
      export APP_PULL_POLICY=always

      INSTALL_MAIL_PASSWORD_B64_VALUE="$(printf '%s' "${INSTALL_MAIL_PASSWORD:-}" | base64 | tr -d '\n')"
      {
        printf 'APP_ENV=%s\n' "${APP_ENV:-production}"
        printf 'APP_DEBUG=%s\n' "${APP_DEBUG:-0}"
        printf 'APP_DOMAIN=%s\n' "$APP_DOMAIN"
        printf 'APP_SYS_ID=%s\n' "$APP_SYS_ID"
        printf 'APP_SYS_MAIL=%s\n' "$APP_SYS_MAIL"
        printf 'APP_CFG_LINK=%s\n' "${APP_CFG_LINK:-_cfg}"
        printf 'APP_DEMO_MODE=%s\n' "${APP_DEMO_MODE:-0}"
        printf 'APP_DATA_KEY=%s\n' "$APP_DATA_KEY"
        printf 'APP_IMAGE=%s\n' "${APP_IMAGE}"
        printf 'APP_IMAGE_TAG=%s\n' "${APP_IMAGE_TAG}"
        printf 'APP_IMAGE_REF=%s\n' "${APP_IMAGE_REF}"
        printf 'APP_PULL_POLICY=%s\n' "${APP_PULL_POLICY}"
        printf 'TELEMETRY_ENDPOINT=%s\n' "${TELEMETRY_ENDPOINT:-https://h-script.com/api/v1/installations}"
        printf 'TELEMETRY_COLLECTOR_ENABLED=%s\n' "${TELEMETRY_COLLECTOR_ENABLED:-0}"
        printf 'TELEMETRY_INGESTION_ENABLED=%s\n' "${TELEMETRY_INGESTION_ENABLED:-0}"
        printf 'TELEMETRY_COLLECTOR_DOMAIN=%s\n' "${TELEMETRY_COLLECTOR_DOMAIN:-h-script.com}"
        printf 'TELEMETRY_RATE_LIMIT=%s\n' "${TELEMETRY_RATE_LIMIT:-30}"
        printf 'APP_BIND_IP=%s\n' "${APP_BIND_IP:-127.0.0.1}"
        printf 'APP_PORT=%s\n' "${APP_PORT:-8080}"
        printf 'APP_EXTERNAL_NETWORK=%s\n' "$APP_EXTERNAL_NETWORK"
        printf 'APP_NETWORK_ALIAS=%s\n' "${APP_NETWORK_ALIAS:-hscript-app}"
        printf 'TRUSTED_PROXY_CIDRS=%s\n' "${TRUSTED_PROXY_CIDRS:-127.0.0.1/32,::1/128}"
        printf 'CONFIGURATOR_PASSWORD=%s\n' "$CONFIGURATOR_PASSWORD"
        printf 'ALLOW_EMPTY_CONFIGURATOR_PASSWORD=%s\n' "${ALLOW_EMPTY_CONFIGURATOR_PASSWORD:-0}"
        printf 'DB_NAME=%s\n' "${DB_NAME:-hscript}"
        printf 'DB_USER=%s\n' "${DB_USER:-hscript}"
        printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
        printf 'MYSQL_ROOT_PASSWORD=%s\n' "$MYSQL_ROOT_PASSWORD"
        printf 'DB_TYPE=%s\n' "${DB_TYPE:-1}"
        printf 'REQUIRE_TURNSTILE=%s\n' "${REQUIRE_TURNSTILE:-1}"
        printf 'TURNSTILE_SITE_KEY=%s\n' "$TURNSTILE_SITE_KEY"
        printf 'TURNSTILE_SECRET_KEY=%s\n' "$TURNSTILE_SECRET_KEY"
        printf 'APP_AUTO_INSTALL=%s\n' "${APP_AUTO_INSTALL:-0}"
        printf 'INSTALL_ADMIN_NAME=%s\n' "${INSTALL_ADMIN_NAME:-Administrator}"
        printf 'INSTALL_ADMIN_LOGIN=%s\n' "${INSTALL_ADMIN_LOGIN:-admin}"
        printf 'INSTALL_ADMIN_PASSWORD=%s\n' "$INSTALL_ADMIN_PASSWORD"
        printf 'INSTALL_ADMIN_MAIL=%s\n' "${INSTALL_ADMIN_MAIL:-$APP_SYS_MAIL}"
        printf 'INSTALL_ADMIN_SECRET_QUESTION=%s\n' "${INSTALL_ADMIN_SECRET_QUESTION:-That is your name}"
        printf 'INSTALL_ADMIN_SECRET_ANSWER=%s\n' "$INSTALL_ADMIN_SECRET_ANSWER"
        printf 'INSTALL_ADMIN_PIN=%s\n' "$INSTALL_ADMIN_PIN"
        printf 'INSTALL_MAIL_HOST=%s\n' "${INSTALL_MAIL_HOST:-}"
        printf 'INSTALL_MAIL_PORT=%s\n' "${INSTALL_MAIL_PORT:-587}"
        printf 'INSTALL_MAIL_SECURE=%s\n' "${INSTALL_MAIL_SECURE:-1}"
        printf 'INSTALL_MAIL_USERNAME=%s\n' "${INSTALL_MAIL_USERNAME:-}"
        printf 'INSTALL_MAIL_PASSWORD_B64=%s\n' "$INSTALL_MAIL_PASSWORD_B64_VALUE"
        printf 'INSTALL_MAIL_FROM_ADDRESS=%s\n' "${INSTALL_MAIL_FROM_ADDRESS:-$APP_SYS_MAIL}"
        printf 'INSTALL_MAIL_ADMIN_ADDRESS=%s\n' "${INSTALL_MAIL_ADMIN_ADDRESS:-${INSTALL_ADMIN_MAIL:-$APP_SYS_MAIL}}"
        printf 'INSTALL_MAIL_ADMIN_LANG=%s\n' "${INSTALL_MAIL_ADMIN_LANG:-en}"
        printf 'INSTALL_DEMO_ADMIN_NAME=%s\n' "${INSTALL_DEMO_ADMIN_NAME:-Demo Administrator}"
        printf 'INSTALL_DEMO_ADMIN_LOGIN=%s\n' "${INSTALL_DEMO_ADMIN_LOGIN:-demo-admin}"
        printf 'INSTALL_DEMO_ADMIN_PASSWORD=%s\n' "${INSTALL_DEMO_ADMIN_PASSWORD:-}"
        printf 'INSTALL_DEMO_ADMIN_MAIL=%s\n' "${INSTALL_DEMO_ADMIN_MAIL:-demo-admin@$APP_DOMAIN}"
        printf 'INSTALL_DEMO_ADMIN_SECRET_QUESTION=%s\n' "${INSTALL_DEMO_ADMIN_SECRET_QUESTION:-That is your demo name}"
        printf 'INSTALL_DEMO_ADMIN_SECRET_ANSWER=%s\n' "${INSTALL_DEMO_ADMIN_SECRET_ANSWER:-$INSTALL_ADMIN_SECRET_ANSWER}"
        printf 'INSTALL_DEMO_ADMIN_PIN=%s\n' "${INSTALL_DEMO_ADMIN_PIN:-$INSTALL_ADMIN_PIN}"
        printf 'INSTALL_NO_LOGINS=%s\n' "${INSTALL_NO_LOGINS:-0}"
        printf 'INSTALL_INT_CURR=%s\n' "${INSTALL_INT_CURR:-0}"
        printf 'INSTALL_INT_CURR_ID=%s\n' "${INSTALL_INT_CURR_ID:-USD}"
        printf 'INSTALL_TELEMETRY_STATS=%s\n' "${INSTALL_TELEMETRY_STATS:-1}"
        printf 'CRON_ENABLED=%s\n' "${CRON_ENABLED:-1}"
        printf 'CRON_URL=%s\n' "${CRON_URL:-http://app/cron}"
        printf 'CRON_HOST_HEADER=%s\n' "${CRON_HOST_HEADER:-$APP_DOMAIN}"
        printf 'CRON_INTERVAL_SECONDS=%s\n' "${CRON_INTERVAL_SECONDS:-60}"
        printf 'CRON_TIMEOUT_SECONDS=%s\n' "${CRON_TIMEOUT_SECONDS:-30}"
        printf 'CRON_START_DELAY_SECONDS=%s\n' "${CRON_START_DELAY_SECONDS:-10}"
        printf 'SESSION_COOKIE_SECURE=%s\n' "${SESSION_COOKIE_SECURE:-1}"
        printf 'SESSION_COOKIE_SAMESITE=%s\n' "${SESSION_COOKIE_SAMESITE:-Lax}"
        printf 'SESSION_GC_MAXLIFETIME=%s\n' "${SESSION_GC_MAXLIFETIME:-2592000}"
      } > .env
    - docker compose --env-file .env config --quiet
    - docker compose --env-file .env pull app cron
    - |
      if ! docker compose --env-file .env up -d --no-build --remove-orphans; then
        docker compose --env-file .env ps || true
        docker compose --env-file .env logs --no-color --tail=200 app cron database || true
        docker compose --env-file .env exec -T app sh -c 'test ! -f logs/error.log || tail -200 logs/error.log' || true
        exit 1
      fi
    - docker compose --env-file .env ps
    - mkdir -p dist
    - sh ci/verify-staging-image.sh > dist/staging-image.txt
  artifacts:
    paths:
      - dist/staging-image.txt
    expire_in: 30 days
  environment:
    name: staging

test:staging-reconciliation:
  stage: verify-staging
  # Wait for the operator to complete the Configurator update, if required.
  # This job only verifies state; it never migrates the database.
  when: manual
  allow_failure: false
  manual_confirmation: 'Завершите требуемое обновление через конфигуратор staging, затем подтвердите проверку. Эта job не запускает миграцию БД. Используйте pipeline текущего развёрнутого образа.'
  resource_group: staging-runtime
  needs:
    - job: build:image-candidate
      artifacts: true
    - job: deploy:staging
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
  script:
    - sh ci/reconcile-staging.sh
  artifacts:
    when: always
    paths: [dist/staging-reconciliation.json]
    expire_in: 30 days

release:promote-public:
  stage: release
  needs:
    - job: build:image-candidate
      artifacts: true
    - job: package:shared-candidate
      artifacts: false
    - job: deploy:staging
      artifacts: false
    - job: test:staging-reconciliation
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
      when: manual
  allow_failure: true
  resource_group: staging-runtime
  script:
    - umask 077
    - sh ci/reconcile-staging.sh
    - |
      test "${CI_COMMIT_SHA}" = "$(git rev-parse HEAD)"
      SOURCE_TREE="$(git rev-parse "${CI_COMMIT_SHA}^{tree}")"
      PUBLIC_TREE_FILES="$(mktemp)"
      cleanup_public_tree_files() {
        rm -f -- "${PUBLIC_TREE_FILES}"
      }
      trap cleanup_public_tree_files EXIT HUP INT TERM

      git ls-tree -r --name-only "${CI_COMMIT_SHA}" > "${PUBLIC_TREE_FILES}"
      if grep -Eq '(^|/)(\.agents|\.codex|\.gitlab|docker/release)(/|$)|(^|/)(future_works?|release-process)\.md$' "${PUBLIC_TREE_FILES}"; then
        echo "Forbidden private file found in the public release tree" >&2
        exit 1
      fi

      git fetch origin release/public
      PUBLIC_PARENT="$(git rev-parse FETCH_HEAD)"
      GITHUB_URL="https://github.com/0x241/h-script.git"
      GITHUB_MAIN="$(git ls-remote "${GITHUB_URL}" refs/heads/main | awk '{print $1}')"
      test -n "${GITHUB_MAIN}"
      if [ "${PUBLIC_PARENT}" != "${GITHUB_MAIN}" ]; then
        echo "release/public ${PUBLIC_PARENT} is not mirrored to GitHub main ${GITHUB_MAIN}" >&2
        echo "Publish or repair the existing public commit before promoting another staging tree" >&2
        exit 1
      fi
      if [ "${SOURCE_TREE}" = "$(git rev-parse "${PUBLIC_PARENT}^{tree}")" ]; then
        echo "The tested staging tree is already present in release/public" >&2
        exit 1
      fi

      if [ -z "${PUBLIC_RELEASE_TITLE:-}" ]; then
        SOURCE_DESCRIPTION_COMMIT="${CI_COMMIT_SHA}"
        set -- $(git show -s --format=%P "${CI_COMMIT_SHA}")
        if [ "$#" -ge 2 ]; then
          SOURCE_DESCRIPTION_COMMIT="$2"
        fi
        PUBLIC_RELEASE_TITLE="$(
          git show -s --format=%s "${SOURCE_DESCRIPTION_COMMIT}" |
            sed -E 's/^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([^)]*\))?!?:[[:space:]]*//'
        )"
      fi

      : "${PUBLIC_RELEASE_TITLE:?Set a human-readable public release title}"
      PUBLIC_RELEASE_TITLE_LENGTH="$(printf '%s' "${PUBLIC_RELEASE_TITLE}" | wc -c | tr -d ' ')"
      if [ "${PUBLIC_RELEASE_TITLE_LENGTH}" -gt 120 ]; then
        echo "PUBLIC_RELEASE_TITLE must not exceed 120 bytes" >&2
        exit 1
      fi
      case "${PUBLIC_RELEASE_TITLE}" in
        *'
      '*)
          echo "PUBLIC_RELEASE_TITLE must be a single printable line" >&2
          exit 1
          ;;
      esac
      if printf '%s' "${PUBLIC_RELEASE_TITLE}" | LC_ALL=C grep -q '[[:cntrl:]]'; then
        echo "PUBLIC_RELEASE_TITLE must be a single printable line" >&2
        exit 1
      fi

      RELEASE_AUTHOR_NAME="${GITLAB_USER_NAME:-H-Script Release Bot}"
      git config user.name "${RELEASE_AUTHOR_NAME}"
      git config user.email "no-reply@h-script.com"
      PUBLIC_COMMIT="$(
        {
          printf 'release: %s\n\n' "${PUBLIC_RELEASE_TITLE}"
          printf 'Promoted from tested staging commit %s.\n' "${CI_COMMIT_SHA}"
        } | git commit-tree "${SOURCE_TREE}" -p "${PUBLIC_PARENT}"
      )"
      test "${SOURCE_TREE}" = "$(git rev-parse "${PUBLIC_COMMIT}^{tree}")"

      PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push "${PUSH_URL}" "${PUBLIC_COMMIT}:refs/heads/release/public"
      git fetch origin release/public
      test "${PUBLIC_COMMIT}" = "$(git rev-parse FETCH_HEAD)"
      printf 'Promoted %s to release/public as %s\n' "${CI_COMMIT_SHA}" "${PUBLIC_COMMIT}"

publish:github-source:
  stage: publish
  needs:
    - job: release:promote-public
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
      when: manual
  allow_failure: true
  resource_group: public-github-source
  script:
    - umask 077
    - |
      : "${GITHUB_RELEASE_TOKEN:?Set protected masked GITHUB_RELEASE_TOKEN}"
      git fetch origin release/public
      PUBLIC_COMMIT="$(git rev-parse FETCH_HEAD)"
      test "$(git rev-parse "${CI_COMMIT_SHA}^{tree}")" = "$(git rev-parse "${PUBLIC_COMMIT}^{tree}")"

      GITHUB_AUTH="$(printf 'x-access-token:%s' "${GITHUB_RELEASE_TOKEN}" | base64 | tr -d '\n')"
      GITHUB_URL="https://github.com/0x241/h-script.git"
      GITHUB_MAIN="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
        ls-remote "${GITHUB_URL}" refs/heads/main | awk '{print $1}')"

      if [ -z "${GITHUB_MAIN}" ]; then
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
          push "${GITHUB_URL}" "${PUBLIC_COMMIT}:refs/heads/main"
      else
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
          fetch --no-tags "${GITHUB_URL}" refs/heads/main
        test "${GITHUB_MAIN}" = "$(git rev-parse FETCH_HEAD)"

        if git merge-base --is-ancestor "${GITHUB_MAIN}" "${PUBLIC_COMMIT}"; then
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
            push "${GITHUB_URL}" "${PUBLIC_COMMIT}:refs/heads/main"
        else
          test "${GITHUB_MAIN}" = "${GITHUB_LEGACY_MAIN_SHA}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
            push --force-with-lease="refs/heads/main:${GITHUB_MAIN}" \
            "${GITHUB_URL}" "${PUBLIC_COMMIT}:refs/heads/main"
        fi
      fi

      GITHUB_MAIN="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
        ls-remote "${GITHUB_URL}" refs/heads/main | awk '{print $1}')"
      test "${PUBLIC_COMMIT}" = "${GITHUB_MAIN}"
      printf 'Published release/public %s to GitHub main\n' "${PUBLIC_COMMIT}"

release:promote-images:
  stage: release
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  needs:
    - job: build:verify-release-candidate
      artifacts: true
    - job: release:evidence
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  allow_failure: false
  resource_group: public-container-release
  script:
    - umask 077
    - |
      : "${DOCKERHUB_USERNAME:?Set protected DOCKERHUB_USERNAME}"
      : "${DOCKERHUB_TOKEN:?Set protected masked DOCKERHUB_TOKEN}"
      : "${GHCR_USERNAME:?Set protected GHCR_USERNAME}"
      : "${GHCR_TOKEN:?Set protected masked GHCR_TOKEN}"

      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      cleanup_public_release() {
        if [ -n "${RELEASE_DOCKER_CONFIG:-}" ] && [ -d "${RELEASE_DOCKER_CONFIG}" ]; then
          rm -rf -- "${RELEASE_DOCKER_CONFIG}"
        fi
      }
      trap cleanup_public_release EXIT HUP INT TERM
      export DOCKER_CONFIG="${RELEASE_DOCKER_CONFIG}"

      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin
      printf '%s' "${DOCKERHUB_TOKEN}" | docker login docker.io --username "${DOCKERHUB_USERNAME}" --password-stdin
      printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GHCR_USERNAME}" --password-stdin

      VERSION="${CI_COMMIT_TAG#v}"
      MINOR="${VERSION%.*}"
      MAJOR="${VERSION%%.*}"
      DOCKERHUB_IMAGE="docker.io/${DOCKERHUB_NAMESPACE}/${PUBLIC_IMAGE_NAME}"
      GHCR_IMAGE="ghcr.io/${GHCR_NAMESPACE}/${PUBLIC_IMAGE_NAME}"

      # Verify signed evidence and exception expiry immediately before any registry write.
      sh ci/supply-chain/evidence.sh publication
      sh ci/supply-chain/promote.sh promote "${CANDIDATE_REF}" "${CANDIDATE_DIGEST}" "${VERSION}" \
        "${CI_REGISTRY_IMAGE}" "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}" > dist/published-images.txt
      cat dist/published-images.txt

      for image in "${DOCKERHUB_IMAGE}" "${GHCR_IMAGE}"; do
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp \
          --env SIGSTORE_ID_TOKEN \
          --env COSIGN_YES=true \
          --env DOCKER_CONFIG=/tmp/docker-config \
          --volume "${DOCKER_CONFIG}:/tmp/docker-config:ro" \
          ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
          sign \
          --yes \
          -a "com.gitlab.ci.pipeline.id=${CI_PIPELINE_ID}" \
          -a "com.gitlab.ci.commit.sha=${CI_COMMIT_SHA}" \
          -a "org.opencontainers.image.source=${CI_PROJECT_URL}" \
          "${image}@${CANDIDATE_DIGEST}"
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp \
          --env DOCKER_CONFIG=/tmp/docker-config \
          --volume "${DOCKER_CONFIG}:/tmp/docker-config:ro" \
          ghcr.io/sigstore/cosign/cosign:v3.0.6@sha256:de9c65609e6bde17e6b48de485ee788407c9502fa08b8f4459f595b21f56cd00 \
          verify \
          --certificate-identity "${CI_PROJECT_URL}//.gitlab-ci.yml@refs/tags/${CI_COMMIT_TAG}" \
          --certificate-oidc-issuer "${CI_SERVER_URL}" \
          "${image}@${CANDIDATE_DIGEST}"
      done
  artifacts:
    when: always
    paths:
      - dist/published-images.txt
      - dist/publication-checks/
      - dist/evidence/
      - dist/release-evidence.tar.gz
      - dist/h-script-*-shared-hosting.tar.gz
      - dist/h-script-*-shared-hosting.tar.gz.sigstore.json
      - dist/SHA256SUMS
    expire_in: never

.publish-github-release-helper:
  before_script:
    - |
      PUBLISH_GITHUB_RELEASE_SCRIPT="${CI_PROJECT_DIR}/.publish-github-release-${CI_JOB_ID}.sh"
      export PUBLISH_GITHUB_RELEASE_SCRIPT
      umask 077
      cat > "${PUBLISH_GITHUB_RELEASE_SCRIPT}" <<'PUBLISH_GITHUB_RELEASE'
      #!/bin/sh

      set -eu

      : "${GITHUB_TOKEN:?GITHUB_TOKEN is required}"
      : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
      : "${RELEASE_TAG:?RELEASE_TAG is required}"
      : "${EXPECTED_SHA:?EXPECTED_SHA is required}"
      : "${ARCHIVE:?ARCHIVE is required}"

      ARTIFACT_DIR="${ARTIFACT_DIR:-/artifacts}"
      API="https://api.github.com/repos/${GITHUB_REPOSITORY}"
      ACCEPT="Accept: application/vnd.github+json"
      AUTH="Authorization: Bearer ${GITHUB_TOKEN}"
      VERSION_HEADER="X-GitHub-Api-Version: 2022-11-28"

      commit_status="$(curl -sS -o /tmp/commit.json -w '%{http_code}' \
        -H "${ACCEPT}" -H "${AUTH}" -H "${VERSION_HEADER}" \
        "${API}/commits/${RELEASE_TAG}")"
      test "${commit_status}" = 200
      actual_sha="$(php -r '$v=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo $v["sha"] ?? "";' /tmp/commit.json)"
      test "${actual_sha}" = "${EXPECTED_SHA}"

      release_status="$(curl -sS -o /tmp/release.json -w '%{http_code}' \
        -H "${ACCEPT}" -H "${AUTH}" -H "${VERSION_HEADER}" \
        "${API}/releases/tags/${RELEASE_TAG}")"
      if [ "${release_status}" = 404 ]; then
        payload="$(php -r 'echo json_encode(["tag_name"=>$argv[1],"name"=>"H-Script ".substr($argv[1],1),"body"=>"Compiled shared-hosting release. Verify SHA256SUMS and the Sigstore bundle before installation.","draft"=>false,"prerelease"=>false,"make_latest"=>"true"], JSON_THROW_ON_ERROR);' "${RELEASE_TAG}")"
        curl --fail-with-body -sS -o /tmp/release.json \
          -X POST -H "${ACCEPT}" -H "${AUTH}" -H "${VERSION_HEADER}" \
          -H 'Content-Type: application/json' --data "${payload}" \
          "${API}/releases"
      else
        test "${release_status}" = 200
      fi

      upload_url="$(php -r '$v=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); echo preg_replace("~\\{.*$~", "", $v["upload_url"] ?? "");' /tmp/release.json)"
      test -n "${upload_url}"
      for filename in "${ARCHIVE}" SHA256SUMS "${ARCHIVE}.sigstore.json" release-evidence.tar.gz; do
        artifact="${ARTIFACT_DIR}/${filename}"
        test -s "${artifact}"
        remote_size="$(php -r '$v=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); foreach (($v["assets"] ?? []) as $asset) { if (($asset["name"] ?? "") === $argv[2]) { echo (string) ($asset["size"] ?? -1); exit; } }' /tmp/release.json "${filename}")"
        if [ -n "${remote_size}" ]; then
          asset_url="$(php -r '$v=json_decode(file_get_contents($argv[1]), true, 512, JSON_THROW_ON_ERROR); foreach ($v["assets"] as $a) if ($a["name"] === $argv[2]) { echo $a["url"]; break; }' /tmp/release.json "${filename}")"
          curl --fail -sS -L -H "${AUTH}" -H 'Accept: application/octet-stream' -H "${VERSION_HEADER}" "${asset_url}" -o /tmp/existing-asset
          test "$(sha256sum "${artifact}" | cut -d ' ' -f 1)" = "$(sha256sum /tmp/existing-asset | cut -d ' ' -f 1)"
          printf 'Verified existing %s\n' "${filename}"
          continue
        fi

        encoded_name="$(php -r 'echo rawurlencode($argv[1]);' "${filename}")"
        curl --fail-with-body -sS -o /tmp/upload.json \
          -X POST -H "${ACCEPT}" -H "${AUTH}" -H "${VERSION_HEADER}" \
          -H 'Content-Type: application/octet-stream' \
          --data-binary "@${artifact}" \
          "${upload_url}?name=${encoded_name}"
        printf 'Published %s\n' "${filename}"
      done
      PUBLISH_GITHUB_RELEASE
      chmod 0500 "${PUBLISH_GITHUB_RELEASE_SCRIPT}"
  after_script:
    - rm -f -- "${CI_PROJECT_DIR}/.publish-github-release-${CI_JOB_ID}.sh"

publish:shared-github-release:
  extends: .publish-github-release-helper
  stage: publish
  needs:
    - job: release:promote-images
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  allow_failure: false
  artifacts:
    when: always
    paths: [dist/publication-checks/]
    expire_in: 30 days
  resource_group: public-github-release
  script:
    - umask 077
    - sh ci/supply-chain/evidence.sh publication
    - |
      : "${GITHUB_RELEASE_TOKEN:?Set protected masked GITHUB_RELEASE_TOKEN}"

      GITHUB_AUTH="$(printf 'x-access-token:%s' "${GITHUB_RELEASE_TOKEN}" | base64 | tr -d '\n')"
      GITHUB_URL="https://github.com/0x241/h-script.git"
      GITHUB_MAIN="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
        ls-remote "${GITHUB_URL}" refs/heads/main | awk '{print $1}')"
      test "${GITHUB_MAIN}" = "${CI_COMMIT_SHA}"

      GITHUB_TAG="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
        ls-remote --refs "${GITHUB_URL}" "refs/tags/${CI_COMMIT_TAG}" | awk '{print $1}')"
      if [ -z "${GITHUB_TAG}" ]; then
        git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
          push "${GITHUB_URL}" "${CI_COMMIT_SHA}:refs/tags/${CI_COMMIT_TAG}"
      else
        test "${GITHUB_TAG}" = "${CI_COMMIT_SHA}"
      fi

      GITHUB_TAG="$(git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${GITHUB_AUTH}" \
        ls-remote --refs "${GITHUB_URL}" "refs/tags/${CI_COMMIT_TAG}" | awk '{print $1}')"
      test "${GITHUB_TAG}" = "${CI_COMMIT_SHA}"

      RELEASE_DOCKER_CONFIG="$(mktemp -d)"
      cleanup_github_release() {
        if [ -n "${RELEASE_DOCKER_CONFIG:-}" ] && [ -d "${RELEASE_DOCKER_CONFIG}" ]; then
          rm -rf -- "${RELEASE_DOCKER_CONFIG}"
        fi
      }
      trap cleanup_github_release EXIT HUP INT TERM
      export DOCKER_CONFIG="${RELEASE_DOCKER_CONFIG}"
      export GITHUB_TOKEN="${GITHUB_RELEASE_TOKEN}"
      printf '%s' "${CI_REGISTRY_PASSWORD}" | docker login "${CI_REGISTRY}" --username "${CI_REGISTRY_USER}" --password-stdin

      ARCHIVE="h-script-${CI_COMMIT_TAG#v}-shared-hosting.tar.gz"
      CANDIDATE_REF="$(cat dist/evidence/candidate-image.txt)"
      docker run --rm \
        --entrypoint /bin/sh \
        --env GITHUB_TOKEN \
        --env GITHUB_REPOSITORY=0x241/h-script \
        --env "RELEASE_TAG=${CI_COMMIT_TAG}" \
        --env "EXPECTED_SHA=${CI_COMMIT_SHA}" \
        --env "ARCHIVE=${ARCHIVE}" \
        --volume "${CI_PROJECT_DIR}/dist:/artifacts:ro" \
        --volume "${PUBLISH_GITHUB_RELEASE_SCRIPT}:/usr/local/share/hscript/publish-github-release.sh:ro" \
        "${CANDIDATE_REF}" \
        /usr/local/share/hscript/publish-github-release.sh

publish:recover-shared-github-release:
  extends: .publish-github-release-helper
  stage: publish
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "stage/docker-release"'
      when: manual
  allow_failure: false
  artifacts:
    when: always
    paths: [dist/publication-checks/]
    expire_in: 30 days
  resource_group: public-github-release
  variables:
    RELEASE_RECOVERY_TAG: ""
    RELEASE_EVIDENCE_JOB_ID: ""
  script:
    - sh ci/supply-chain/recover-publication.sh
