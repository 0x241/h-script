ServerRoot /var/www
PidFile /run/apache2/httpd.pid
Listen 80
ServerName localhost
UseCanonicalName On
ServerTokens Prod
ServerSignature Off
TraceEnable Off

LoadModule mpm_event_module /usr/lib/apache2/mod_mpm_event.so
LoadModule unixd_module /usr/lib/apache2/mod_unixd.so
LoadModule authz_core_module /usr/lib/apache2/mod_authz_core.so
LoadModule authz_host_module /usr/lib/apache2/mod_authz_host.so
LoadModule dir_module /usr/lib/apache2/mod_dir.so
LoadModule env_module /usr/lib/apache2/mod_env.so
LoadModule headers_module /usr/lib/apache2/mod_headers.so
LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
LoadModule mime_module /usr/lib/apache2/mod_mime.so
LoadModule proxy_module /usr/lib/apache2/mod_proxy.so
LoadModule proxy_fcgi_module /usr/lib/apache2/mod_proxy_fcgi.so
LoadModule rewrite_module /usr/lib/apache2/mod_rewrite.so
LoadModule setenvif_module /usr/lib/apache2/mod_setenvif.so

User apache
Group apache

TypesConfig /etc/apache2/mime.types
DirectoryIndex index.php rw.php index.html

ErrorLog /proc/self/fd/2
CustomLog /proc/self/fd/1 combined

SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

DocumentRoot "/var/www/html"

<Directory "/var/www/html">
    Options FollowSymLinks
    AllowOverride None
    Require all granted

    RewriteEngine On
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]

    RewriteCond %{HTTP_HOST} ^www\.(.*)$ [NC]
    RewriteRule ^ http://%1%{REQUEST_URI} [R=301,L]

    RewriteCond %{REQUEST_URI} !\.(gif|jpg|jpeg|png|ico|svg|swf|txt|js|css|zip|htc|ttf|otf|eot|woff|woff2|pdf)$ [NC]
    RewriteCond %{REQUEST_URI} !^/rw\.php$
    RewriteRule ^ /rw.php [L,QSA]
</Directory>

<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://127.0.0.1:9000"
</FilesMatch>

<FilesMatch "^(?:_config(?:\.local)?|composer\.(?:json|lock)|memory|tasks|future_work|AGENTS)\b">
    Require all denied
</FilesMatch>

<DirectoryMatch "^/var/www/html/(?:\.git|\.agents|\.codex|\.cfg|backup|compile|docker|lib|logs|module|tpl|tpl_c|vendor)(?:/|$)">
    Require all denied
</DirectoryMatch>

<Directory "/var/www/html/upload">
    Require all granted
    <FilesMatch "\.(?:php|phtml|php[0-9]?|phps|cgi|pl|asp|aspx|shtml|shtm|fcgi|fpl|jsp|wml)$">
        Require all denied
    </FilesMatch>
</Directory>
